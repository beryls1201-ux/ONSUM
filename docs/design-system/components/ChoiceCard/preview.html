<!-- @dsCard group="Content" height=470 width=1000 subtitle="P1 나 / 선물 카드 · P2 사진 선택지" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
.wrap{font-family:var(--font-sans);color:var(--ink);background:var(--surface-cream);padding:24px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.card{background:var(--surface-linen);border-radius:var(--radius-lg);padding:20px 20px 28px;display:flex;flex-direction:column;gap:24px}
.img{aspect-ratio:548/240;border-radius:var(--radius-md);background:var(--scent-summer-night);position:relative}
.tag{position:absolute;left:14px;bottom:12px;padding:5px 10px;border-radius:var(--radius-pill);background:rgba(46,42,38,.55);color:var(--on-ink);font-size:11px;font-weight:500}
h3{margin:0;font:400 28px/1.35 var(--font-display);letter-spacing:-.015em}
p{margin:0;font-size:16px;line-height:1.7;color:var(--ink-muted)}
.body{padding:0 8px;display:flex;flex-direction:column;gap:12px}
.btn{align-self:flex-start;margin-left:8px;display:inline-flex;align-items:center;gap:10px;height:var(--control-lg);padding:0 28px;border-radius:var(--radius-pill);background:var(--ink);color:var(--on-ink);font:500 16px/1 var(--font-sans);border:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.opt{position:relative;aspect-ratio:250/240;border-radius:var(--radius-md);overflow:hidden;border:3px solid transparent;box-sizing:border-box}
.opt.on{border-color:var(--sage-deep)}
.opt span.name{position:absolute;left:8px;right:8px;bottom:12px;text-align:center;color:#fff;font-size:15px;font-weight:500}
.opt::after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(180deg,rgba(46,42,38,0),rgba(46,42,38,.55))}
.opt span{z-index:1}
.check{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:var(--radius-pill);background:var(--sage-deep);display:flex;align-items:center;justify-content:center}
</style>
<div class="wrap">
<article class="card">
<div class="img"><span class="tag">IMG-P1-02 · 548×240</span></div>
<div class="body"><h3>나의 일상에 어울리는 향</h3><p>내가 좋아하는 일상의 장면을 골라주세요.<br>답변에 담긴 분위기를 바탕으로 어울리는 향 3가지를 추천해드려요.</p></div>
<button class="btn" type="button">나를 위한 향 찾기 →</button>
</article>
<div class="opts" role="group" aria-label="사진 선택지">
<div class="opt on" style="background:var(--scent-autumn-morning)"><span class="check"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F7F2EA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="name">따뜻한 차를 끓인다</span></div>
<div class="opt" style="background:var(--scent-summer-day)"><span class="name">창문을 연다</span></div>
</div>
</div>
