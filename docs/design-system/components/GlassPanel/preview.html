<!-- @dsCard group="Content" height=420 width=1000 subtitle="P1 첫 화면 유리 글 상자 + 카운트업 숫자" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&family=Quicksand:wght@500;600&display=swap">
<style>
.hero{position:relative;height:400px;border-radius:var(--radius-xl);overflow:hidden;background:linear-gradient(180deg,#D9C4A6,#C9AE8D);font-family:var(--font-sans);color:var(--ink)}
.win{position:absolute;top:0;right:100px;width:300px;height:220px;background:rgba(255,246,228,.45)}
.glass{position:absolute;left:32px;bottom:32px;width:520px;box-sizing:border-box;padding:28px 32px;border-radius:var(--radius-xl);background:rgba(247,242,234,.66);backdrop-filter:blur(20px) saturate(1.1);-webkit-backdrop-filter:blur(20px) saturate(1.1);border:1px solid rgba(255,255,255,.55);display:flex;flex-direction:column;gap:16px}
h1{margin:0;font:400 36px/1.28 var(--font-display);letter-spacing:-.02em}
p{margin:0;font-size:15px;line-height:1.7;color:var(--ink-body)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(46,42,38,.14);padding-top:12px}
.nums div{display:flex;flex-direction:column;gap:2px}
.nums div+div{border-left:1px solid rgba(46,42,38,.14);padding-left:16px}
.nums b{font:600 32px/1.1 var(--font-num)}
.nums span{font-size:13px;color:var(--ink-muted)}
.btn{align-self:flex-start;display:inline-flex;align-items:center;height:var(--control-lg);padding:0 28px;border-radius:var(--radius-pill);background:var(--ink);color:var(--on-ink);font:500 16px var(--font-sans);border:0}
</style>
<div class="hero">
<div class="win" aria-hidden="true"></div>
<div class="glass">
<h1>취향을 따라,<br>나에게 닿는 향</h1>
<p>일상의 장면을 묻는 네 가지 질문에 답해보세요.</p>
<div class="nums"><div><b>4</b><span>장면 질문</span></div><div><b>12</b><span>계절 · 시간의 향</span></div><div><b>3</b><span>추천 향</span></div></div>
<button class="btn" type="button">내 향 찾기 ↓</button>
</div>
</div>
