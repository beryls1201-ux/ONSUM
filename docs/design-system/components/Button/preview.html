<!-- @dsCard group="Actions" height=260 subtitle="주요 · 보조 · 담기 막대 · 아이콘 버튼" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&family=Quicksand:wght@500;600&display=swap">
<style>
.wrap{font-family:var(--font-sans);color:var(--ink);background:var(--surface-cream);padding:24px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lbl{font-size:12px;font-weight:500;color:var(--ink-subtle);width:96px}
.btn{display:inline-flex;align-items:center;gap:10px;height:var(--control-lg);padding:0 28px;border-radius:var(--radius-pill);font:500 16px/1 var(--font-sans);border:0;cursor:pointer;box-sizing:border-box}
.primary{background:var(--ink);color:var(--on-ink)}
.primary.hover{background:var(--sage-deep)}
.primary.dim{opacity:.4}
.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.secondary.hover{background:var(--surface-linen)}
.addbar{height:var(--control-sm);padding:0 20px;background:var(--surface-white);color:var(--ink);font-size:15px;box-shadow:var(--shadow-addbar)}
.icon{width:var(--control-sm);height:var(--control-sm);padding:0;justify-content:center;border:1px solid var(--line);background:transparent;color:var(--ink)}
svg{flex:0 0 auto}
</style>
<div class="wrap">
<div class="row"><span class="lbl">주요</span>
<button class="btn primary" type="button">나를 위한 향 찾기 <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
<button class="btn primary hover" type="button">마우스 올림</button>
<button class="btn primary dim" type="button">선택 전</button></div>
<div class="row"><span class="lbl">보조</span>
<button class="btn secondary" type="button">향 소개 보기</button>
<button class="btn secondary hover" type="button">마우스 올림</button></div>
<div class="row"><span class="lbl">담기 · 아이콘</span>
<button class="btn addbar" type="button"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>장바구니 담기</button>
<button class="btn icon" type="button" aria-label="닫기"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>
</div>
