<!-- @dsCard group="Content" height=200 subtitle="단계 칩 · 답 칩 · 순위 배지 · 상태 배지 · 대표 색 원" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Quicksand:wght@500;600&display=swap">
<style>
.wrap{font-family:var(--font-sans);color:var(--ink);background:var(--surface-cream);padding:24px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:12px;height:var(--control-md);padding:0 20px 0 8px;border-radius:var(--radius-pill);background:var(--surface-linen);font-size:15px;font-weight:500}
.step i{font-style:normal;width:32px;height:32px;border-radius:var(--radius-pill);background:var(--surface-cream);display:inline-flex;align-items:center;justify-content:center;font:600 15px/1 var(--font-num)}
.line{width:32px;height:1px;background:var(--line-strong)}
.ans{padding:6px 14px;border-radius:var(--radius-pill);background:var(--surface-linen);font-size:14px}
.rank{height:30px;padding:0 14px;border-radius:var(--radius-pill);background:var(--apricot);display:inline-flex;align-items:center;font-size:14px;font-weight:700}
.status{height:30px;padding:0 14px;border-radius:var(--radius-pill);border:1.5px solid var(--sage-deep);color:var(--sage-deep);display:inline-flex;align-items:center;font-size:14px;font-weight:700;box-sizing:border-box}
.dot{width:20px;height:20px;border-radius:var(--radius-pill);border:1px solid rgba(46,42,38,.15)}
</style>
<div class="wrap">
<div class="row"><span class="step"><i>1</i>장면 질문 4개</span><span class="line"></span><span class="step"><i>2</i>어울리는 향 3가지 추천</span><span class="line"></span><span class="step"><i>3</i>바로 구매 또는 선물 카드</span></div>
<div class="row"><span class="ans">따뜻한 차를 끓인다</span><span class="rank">1위</span><span class="status">결제 완료</span>
<span class="dot" style="background:var(--scent-spring-morning)"></span><span class="dot" style="background:var(--scent-summer-day)"></span><span class="dot" style="background:var(--scent-autumn-night)"></span><span class="dot" style="background:var(--scent-winter-night)"></span></div>
</div>
